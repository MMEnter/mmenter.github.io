# Site settings — edit these to make the site yours.
title: mmenter
description: Thoughts, notes, and ideas.
author: mmenter
url: "https://mmenter.github.io"
baseurl: ""

# Pretty post URLs: /blog/2026/10/31/my-post/
permalink: /blog/:year/:month/:day/:title/

markdown: kramdown

# Both plugins are supported natively by GitHub Pages.
plugins:
  - jekyll-feed      # RSS/Atom feed at /feed.xml
  - jekyll-seo-tag   # Titles, descriptions, and LinkedIn/social preview cards

exclude:
  - README.md
