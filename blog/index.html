---
layout: default
title: Blog
---
<main class="container">
  <h1>Blog</h1>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <span class="post-meta">{{ post.date | date: '%B %-d, %Y' }}</span>
      {% if post.description %}<p>{{ post.description }}</p>{% endif %}
    </li>
    {% endfor %}
  </ul>
</main>
